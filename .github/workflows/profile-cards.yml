name: Update profile cards

# Generates the GitHub stats card, top-languages card and contribution snake
# as SVGs, then commits them to assets/generated/ so the README serves them
# from this repository instead of depending on a shared public instance.

on:
  schedule:
    - cron: "0 3 * * *" # daily, 06:00 Nairobi time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/generated/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Languages that only appear because of committed virtualenvs and Flutter
  # platform boilerplate in some repositories, not code written by hand.
  # Options are parsed with URLSearchParams, so "+" must be written as %2B.
  HIDDEN_LANGS: c,c%2B%2B,cmake,cython,powershell,batchfile,roff,shell,swift,objective-c,kotlin,ejs
  DARK: bg_color=0D1117&title_color=3DDC97&text_color=C9D1D9&icon_color=3DDC97&border_color=30363D&border_radius=12
  LIGHT: bg_color=FFFFFF&title_color=0E8A5F&text_color=24292F&icon_color=0E8A5F&border_color=D0D7DE&border_radius=12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&card_width=420&${{ env.DARK }}
          path: assets/generated/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&card_width=420&${{ env.LIGHT }}
          path: assets/generated/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&card_width=420&hide=${{ env.HIDDEN_LANGS }}&${{ env.DARK }}
          path: assets/generated/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&card_width=420&hide=${{ env.HIDDEN_LANGS }}&${{ env.LIGHT }}
          path: assets/generated/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-light.svg?palette=github-light&color_snake=#0E8A5F
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#3DDC97

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
